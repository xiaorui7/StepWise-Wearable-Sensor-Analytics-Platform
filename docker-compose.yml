services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stepwise
      POSTGRES_USER: stepwise
      POSTGRES_PASSWORD: stepwise
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepwise -d stepwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-env
      STEPWISE_DATABASE_URL: postgresql+psycopg://stepwise:stepwise@postgres:5432/stepwise
      STEPWISE_REDIS_URL: redis://redis:6379/0
      STEPWISE_ARTIFACT_ROOT: /data/artifacts
      STEPWISE_CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: [artifact_data:/data/artifacts]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m stepwise.worker
    environment: *backend-env
    volumes: [artifact_data:/data/artifacts]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  artifact_data:
