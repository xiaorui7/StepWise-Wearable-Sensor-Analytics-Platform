[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stepwise-platform"
version = "0.1.0"
description = "Non-diagnostic wearable-sensor analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "redis>=5.2,<6",
  "rq>=2.1,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
stepwise-analyze = "stepwise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stepwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires a PostgreSQL test database",
  "e2e: end-to-end analysis workflow",
]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["analysis", "miniprogram"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stepwise"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["stepwise"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
