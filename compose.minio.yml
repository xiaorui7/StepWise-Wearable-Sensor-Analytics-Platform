# Optional isolated demo: docker compose -p stepwise-s3 -f docker-compose.yml -f compose.minio.yml --profile s3 up --build -d --scale worker=2
services:
  minio:
    profiles: [s3]
    image: stepwise-minio:local
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STEPWISE_S3_ACCESS_KEY:-stepwise-demo}
      MINIO_ROOT_PASSWORD: ${STEPWISE_S3_SECRET_KEY:-local-demo-only-change-me}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    profiles: [s3]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, stepwise.init_bucket]
    environment: &s3-env
      STEPWISE_STORAGE_BACKEND: s3
      STEPWISE_S3_ENDPOINT_URL: http://minio:9000
      STEPWISE_S3_BUCKET: stepwise
      STEPWISE_S3_ACCESS_KEY: ${STEPWISE_S3_ACCESS_KEY:-stepwise-demo}
      STEPWISE_S3_SECRET_KEY: ${STEPWISE_S3_SECRET_KEY:-local-demo-only-change-me}
    depends_on:
      minio: {condition: service_healthy}
  api:
    environment: *s3-env
    volumes: !reset []
    ports: !override ["127.0.0.1:8000:8000"]
    depends_on:
      minio-init: {condition: service_completed_successfully}
  worker:
    environment: *s3-env
    volumes: !reset []
    depends_on:
      minio-init: {condition: service_completed_successfully}
  tests:
    environment:
      STEPWISE_TEST_S3_ENDPOINT: http://minio:9000
      STEPWISE_TEST_S3_ACCESS_KEY: ${STEPWISE_S3_ACCESS_KEY:-stepwise-demo}
      STEPWISE_TEST_S3_SECRET_KEY: ${STEPWISE_S3_SECRET_KEY:-local-demo-only-change-me}
    depends_on:
      minio-init: {condition: service_completed_successfully}
volumes:
  minio_data:
