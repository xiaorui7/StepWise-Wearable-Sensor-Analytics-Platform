apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: stepwise}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: stepwise:kind
          imagePullPolicy: Never
          command: [uvicorn, stepwise.api.main:app, --host, 0.0.0.0, --port, "8000"]
          envFrom:
            - configMapRef: {name: stepwise-config}
            - secretRef: {name: stepwise-demo-secrets}
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            timeoutSeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            timeoutSeconds: 3
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: stepwise}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: stepwise}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: stepwise:kind
          imagePullPolicy: Never
          command: [python, -m, stepwise.worker]
          envFrom:
            - configMapRef: {name: stepwise-config}
            - secretRef: {name: stepwise-demo-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: [python, -m, stepwise.worker_probe]}
            timeoutSeconds: 10
            periodSeconds: 15
            initialDelaySeconds: 10
