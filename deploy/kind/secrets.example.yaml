# Public development values, not production credentials. ClusterIP + local port-forward only.
apiVersion: v1
kind: Secret
metadata:
  name: stepwise-demo-secrets
  namespace: stepwise
type: Opaque
stringData:
  POSTGRES_DB: stepwise
  POSTGRES_USER: stepwise
  POSTGRES_PASSWORD: stepwise-local-demo
  STEPWISE_DATABASE_URL: postgresql+psycopg://stepwise:stepwise-local-demo@postgres:5432/stepwise
  MINIO_ROOT_USER: stepwise-demo
  MINIO_ROOT_PASSWORD: local-demo-only-change-me
  STEPWISE_S3_ACCESS_KEY: stepwise-demo
  STEPWISE_S3_SECRET_KEY: local-demo-only-change-me
