name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stepwise_test
          POSTGRES_USER: stepwise
          POSTGRES_PASSWORD: stepwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stepwise -d stepwise_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      STEPWISE_DATABASE_URL: postgresql+psycopg://stepwise:stepwise@localhost:5432/stepwise_test
      STEPWISE_TEST_POSTGRES_URL: postgresql+psycopg://stepwise:stepwise@localhost:5432/stepwise_test
      STEPWISE_REDIS_URL: redis://localhost:6379/0
      STEPWISE_ARTIFACT_ROOT: /tmp/stepwise-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src/stepwise
      - run: alembic upgrade head
      - run: pytest --cov=stepwise --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
      - run: docker build -f backend/Dockerfile -t stepwise-api:test .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: docker build -t stepwise-web:test .
